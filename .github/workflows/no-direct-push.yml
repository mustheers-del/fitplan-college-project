name: no-direct-push

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail only on genuine direct pushes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Commit ${{ github.sha }} arrived via a pull request. OK."
            exit 0
          fi
          echo "::error::Direct push to ${{ github.ref_name }} by ${{ github.actor }}."
          echo "Use feat/<name>-<thing> -> PR -> dev."
          exit 1
