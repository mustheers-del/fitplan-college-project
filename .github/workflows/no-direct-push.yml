name: no-direct-push

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check push was a merge commit
        run: |
          parents=$(git rev-list --parents -n 1 "${{ github.sha }}" | awk '{print NF-1}')

          if [ "$parents" -ge 2 ]; then
            echo "Commit arrived through a merge commit. OK."
            exit 0
          fi

          echo "::error::Direct push to ${{ github.ref_name }} by ${{ github.actor }}."
          echo "Use feat/<name>-<thing> -> PR -> dev."
          exit 1