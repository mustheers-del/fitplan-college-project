name: no-direct-push

on:
  push:
    branches:
      - main
      - dev

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Block direct pushes
        run: |
          echo "::error::Direct push detected to ${{ github.ref_name }} by ${{ github.actor }}."
          echo "Please use a Pull Request instead of pushing directly."
          exit 1
