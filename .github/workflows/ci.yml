name: CI

on:
  pull_request:
    branches:
      - main
      - dev

  push:
    branches:
      - main
      - dev

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # working-directory is explicit because the job-wide default was removed
      # in 0f3888f so pytest could run from the repo root. Without this line
      # ruff would scan frontend/ and scripts/ too.
      #
      # Warn-mode for now: 43 findings in backend/, all style and Python-version
      # modernisation, none of them bugs. Flip to blocking once the sweep is
      # agreed and done.
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
        continue-on-error: true

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: pytest -q --import-mode=importlib

  template:
    name: SAM Template Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so CI and local agree - an unpinned lint tool silently changes
      # its ruleset between runs.
      - name: Install cfn-lint
        run: pip install cfn-lint==1.55.1

      - name: Lint SAM template
        run: cfn-lint backend/template.yaml
